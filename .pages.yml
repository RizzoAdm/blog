# Pages CMS — editor do blog no navegador (https://app.pagescms.org)
# Etapa B6. Documentação: https://pagescms.org/docs/
#
# Posts bilíngues: cada post é uma pasta em content/posts/<chave>/
#   index.md        -> versão em inglês   (lista "Posts (English)")
#   index.pt-br.md  -> versão em português (lista "Artigos (Português)")
# A "chave" (translationKey) é o nome da pasta. Use a MESMA chave nas duas
# versões para que caiam na mesma pasta, virem tradução uma da outra e
# compartilhem os comentários do giscus.

# Imagens enviadas pelo CMS vão para static/images/ e são publicadas em
# /blog/images/. Antes de enviar fotos, remova os dados EXIF/GPS.
media:
  input: static/images
  output: /blog/images
  categories: [image]
  rename: safe

settings:
  content:
    # Ao salvar, mantém no front matter campos que o CMS não conhece
    merge: true

content:
  # ------------------------------------------------------------ English
  - name: posts-en
    label: Posts (English)
    description: English posts — content/posts/<key>/index.md
    type: collection
    path: content/posts
    filename: "{fields.translationKey}/index.md"
    format: yaml-frontmatter
    exclude: ["_index.md", "_index.pt-br.md", "index.pt-br.md"]
    operations:
      rename: false
    view:
      layout: tree
      node:
        filename: index.md
        hideDirs: all
      primary: title
      fields: [title, date, draft, tags]
      sort: [date, title]
      search: [title, summary, tags]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: translationKey
        label: Key (folder name)
        description: "Lowercase letters, numbers and hyphens (e.g. homelab-vlans). Becomes the folder and the English URL. Use the same key in the Portuguese version. Don't change it after publishing."
        type: string
        required: true
        pattern:
          regex: "^[a-z0-9]+(-[a-z0-9]+)*$"
          message: "Only lowercase letters, numbers and single hyphens."
      - name: date
        label: Date
        type: date
        required: true
      - name: draft
        label: Draft (not published)
        type: boolean
        default: true
      - name: tags
        label: Tags
        type: string
        list: true
      - name: summary
        label: Summary
        description: One or two sentences shown in the post list and in search results.
        type: text
      - name: comments
        label: Comments
        type: boolean
        default: true
      - name: body
        label: Post
        type: rich-text

  # ---------------------------------------------------------- Português
  - name: posts-pt
    label: Artigos (Português)
    description: Artigos em português — content/posts/<chave>/index.pt-br.md
    type: collection
    path: content/posts
    filename: "{fields.translationKey}/index.pt-br.md"
    format: yaml-frontmatter
    exclude: ["_index.md", "_index.pt-br.md", "index.md"]
    operations:
      rename: false
    view:
      layout: tree
      node:
        filename: index.pt-br.md
        hideDirs: all
      primary: title
      fields: [title, date, draft, tags]
      sort: [date, title]
      search: [title, summary, tags]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Título
        type: string
        required: true
      - name: slug
        label: Slug (URL em português)
        description: "Ex.: vlans-no-homelab → /blog/pt-br/artigos/vlans-no-homelab/. Minúsculas, números e hífens, sem acentos."
        type: string
        required: true
        pattern:
          regex: "^[a-z0-9]+(-[a-z0-9]+)*$"
          message: "Só letras minúsculas sem acento, números e hífens simples."
      - name: translationKey
        label: Chave (nome da pasta)
        description: "Igual à chave da versão em inglês (ex.: homelab-vlans). Se o artigo for só em português, invente uma chave nova. Não mude depois de publicar."
        type: string
        required: true
        pattern:
          regex: "^[a-z0-9]+(-[a-z0-9]+)*$"
          message: "Só letras minúsculas sem acento, números e hífens simples."
      - name: date
        label: Data
        type: date
        required: true
      - name: draft
        label: Rascunho (não publicado)
        type: boolean
        default: true
      - name: tags
        label: Etiquetas
        description: "Use as mesmas tags da versão em inglês (ex.: homelab, git)."
        type: string
        list: true
      - name: summary
        label: Resumo
        description: Uma ou duas frases mostradas na lista de artigos e na busca.
        type: text
      - name: comments
        label: Comentários
        type: boolean
        default: true
      - name: body
        label: Artigo
        type: rich-text
