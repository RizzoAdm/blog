baseURL = 'https://rizzoadm.github.io/blog/'
title = 'Mr. Rizzo · Blog'
theme = 'PaperMod'

defaultContentLanguage = 'en'
defaultContentLanguageInSubdir = false
enableRobotsTXT = true
# Slugs gerados a partir do título sem acentos (ex.: "Olá, mundo" -> ola-mundo)
removePathAccents = true

[pagination]
  pagerSize = 10

[outputs]
  home = ['HTML', 'RSS', 'JSON']

# Só tags (sem categories)
[taxonomies]
  tag = 'tags'

[languages]
  # ---------- English (default, sem prefixo: /blog/) ----------
  [languages.en]
    label = 'English'
    locale = 'en-US'
    weight = 1
    title = 'Mr. Rizzo · Blog'
    [languages.en.params]
      description = 'Notes on homelab, local AI, git, ServiceNow and everyday things.'
      [languages.en.params.homeInfoParams]
        Title = 'Mr. Rizzo · Blog'
        Content = 'Hands-on notes on homelab, local AI, git and ServiceNow — plus the occasional everyday topic. Posts in English and Portuguese.'
    [[languages.en.menus.main]]
      name = 'Posts'
      pageRef = '/posts'
      weight = 10
    [[languages.en.menus.main]]
      name = 'Tags'
      pageRef = '/tags'
      weight = 20
    [[languages.en.menus.main]]
      name = 'Archive'
      pageRef = '/archives'
      weight = 30
    [[languages.en.menus.main]]
      name = 'Search'
      pageRef = '/search'
      weight = 40
    [[languages.en.menus.main]]
      name = 'Portfolio'
      url = 'https://rizzoadm.github.io/'
      weight = 50

  # ---------- Português (prefixo /blog/pt-br/) ----------
  [languages.pt-br]
    label = 'Português'
    locale = 'pt-BR'
    weight = 2
    title = 'Mr. Rizzo · Blog'
    [languages.pt-br.params]
      description = 'Notas sobre homelab, IA local, git, ServiceNow e coisas do dia a dia.'
      [languages.pt-br.params.homeInfoParams]
        Title = 'Mr. Rizzo · Blog'
        Content = 'Notas práticas sobre homelab, IA local, git e ServiceNow — e, de vez em quando, coisas do dia a dia. Posts em português e inglês.'
    # URLs em português (o menu usa pageRef, então continua funcionando)
    [languages.pt-br.permalinks]
      [languages.pt-br.permalinks.page]
        posts = '/artigos/:slugorcontentbasename/'
      [languages.pt-br.permalinks.section]
        posts = '/artigos/'
      [languages.pt-br.permalinks.taxonomy]
        tags = '/etiquetas/'
      [languages.pt-br.permalinks.term]
        tags = '/etiquetas/:slug/'
    [[languages.pt-br.menus.main]]
      name = 'Artigos'
      pageRef = '/posts'
      weight = 10
    [[languages.pt-br.menus.main]]
      name = 'Etiquetas'
      pageRef = '/tags'
      weight = 20
    [[languages.pt-br.menus.main]]
      name = 'Arquivo'
      pageRef = '/archives'
      weight = 30
    [[languages.pt-br.menus.main]]
      name = 'Busca'
      pageRef = '/search'
      weight = 40
    [[languages.pt-br.menus.main]]
      name = 'Portfólio'
      url = 'https://rizzoadm.github.io/'
      weight = 50

[params]
  env = 'production'
  author = 'Mr. Rizzo'
  defaultTheme = 'auto'
  disableThemeToggle = false
  disableLangToggle = false
  displayFullLangName = true
  ShowReadingTime = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = false
  ShowShareButtons = false
  comments = false

  [[params.socialIcons]]
    name = 'github'
    url = 'https://github.com/RizzoAdm'
  [[params.socialIcons]]
    name = 'linkedin'
    url = 'https://www.linkedin.com/in/rizzo-admin/'
  [[params.socialIcons]]
    name = 'rss'
    url = 'index.xml'

  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    threshold = 0.4
    minMatchCharLength = 2
    keys = ['title', 'summary', 'content']

[markup.highlight]
  noClasses = false
